<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ignore dev WebSocket/HMR transport errors in AI Studio iframe environment
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.message?.includes('createWebSocketModuleRunnerTransport') || e.filename?.includes('@vite/client'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reasonStr = (e && e.reason) ? String(e.reason.message || e.reason) : '';
        if (reasonStr.includes('WebSocket') || reasonStr.includes('createWebSocketModuleRunnerTransport') || reasonStr.includes('@vite/client')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <title>Limitless Quant - Asymmetric Mean Reversion Bot</title>
    <meta name="description" content="Production TypeScript trading bot and simulation terminal for Limitless Exchange prediction markets, featuring Bollinger Bands & RSI asymmetric mean reversion strategy." />
    <meta property="og:title" content="Limitless Quant - Asymmetric Mean Reversion Bot" />
    <meta property="og:description" content="Production TypeScript trading bot and simulation terminal for Limitless Exchange prediction markets, featuring Bollinger Bands & RSI asymmetric mean reversion strategy." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/20 selection:text-cyan-300 font-['Cairo',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
